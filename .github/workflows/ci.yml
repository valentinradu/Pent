name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A test that skips proves nothing. With this variable, each skip is a
  # failure, so a job cannot stay green while the sandbox never ran. See
  # crates/pent/tests/common/e2e.rs.
  PENT_REQUIRE_ALL_TESTS: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The version of the runner decides which sandbox features work. Print
      # it, so that a future failure is easy to place.
      - name: Show the platform (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /etc/os-release | head -2
          echo "user.max_user_namespaces=$(sysctl -n user.max_user_namespaces 2>/dev/null || echo unknown)"

      - name: Show the platform (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          echo "developer directory: $(xcode-select --print-path 2>/dev/null || echo none)"
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables 2>/dev/null \
            || echo "the command line tools package is not registered"
          clang --version | head -1 || true
          ls -l /usr/bin/sandbox-exec /usr/bin/log /usr/bin/logger || true

      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor. Pent
      # needs them. Without this step every sandbox test skips, and the job
      # proves nothing.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this kernel has no apparmor_restrict_unprivileged_userns knob"
          fi

      - name: Build
        run: cargo build --workspace --tests

      # TEMPORARY (step 0 of the work on MAC-4 and MAC-10). The step
      # measures three things that only a Mac can answer:
      #
      # 1. Does `launchctl submit` run a job on this runner at all? The
      #    test of MAC-4 proves nothing without that control.
      # 2. Which Mach services does an ordinary program look up? The
      #    answer is the allowlist of `(deny mach-lookup)`.
      # 3. Does `(deny job-creation)` compile, and does it stop the job?
      #
      # The step never fails, so the job stays green and the log holds the
      # answers. Remove this step when the findings have a verdict.
      - name: Probe the open macOS findings
        if: runner.os == 'macOS'
        run: |
          set +e
          out=$(mktemp -d)
          echo "=== P1 launchctl submit outside the sandbox ==="
          l1="pent-probe-out-$$"
          /bin/launchctl submit -l "$l1" -- /bin/sh -c "touch '$out/p1'"
          echo "submit exit=$?"
          sleep 3
          /bin/launchctl remove "$l1"; echo "remove exit=$?"
          if [ -e "$out/p1" ]; then echo "P1: launchd RAN the job"; else echo "P1: launchd ran NO job"; fi

          echo "=== P2 launchctl submit under (allow default) ==="
          l2="pent-probe-allow-$$"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /bin/sh -c \
            "/bin/launchctl submit -l $l2 -- /bin/sh -c \"touch '$out/p2'\""
          echo "exit=$?"
          sleep 3
          /bin/launchctl remove "$l2" 2>/dev/null
          if [ -e "$out/p2" ]; then echo "P2: launchd RAN the job"; else echo "P2: launchd ran NO job"; fi

          echo "=== P3 does (deny job-creation) compile ==="
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny job-creation)' /usr/bin/true
          echo "P3 exit=$?"

          echo "=== P4 launchctl submit under (deny job-creation) ==="
          l4="pent-probe-job-$$"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny job-creation)' /bin/sh -c \
            "/bin/launchctl submit -l $l4 -- /bin/sh -c \"touch '$out/p4'\""
          echo "exit=$?"
          sleep 3
          /bin/launchctl remove "$l4" 2>/dev/null
          if [ -e "$out/p4" ]; then echo "P4: launchd RAN the job"; else echo "P4: launchd ran NO job"; fi

          echo "=== P5 does (deny mach-lookup) compile, and does a shell run ==="
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny mach-lookup)' /bin/sh -c 'echo P5_SHELL_RAN'
          echo "P5 exit=$?"

          echo "=== P6 an ordinary program under (deny mach-lookup) ==="
          start=$(date -u +%Y-%m-%d\ %H:%M:%S)
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny mach-lookup)' /bin/sh -c \
            'echo P6_RAN; /usr/bin/id; /bin/ls / >/dev/null; echo P6_LS=$?; /usr/bin/curl -s -o /dev/null -m 20 https://example.com; echo P6_CURL=$?; /usr/bin/python3 -c "import socket;print(socket.gethostbyname(\"example.com\"))"; echo P6_DNS=$?'
          echo "P6 exit=$?"
          sleep 2

          echo "=== P7 the mach-lookup denials of P5 and P6 ==="
          /usr/bin/log show --style syslog --start "$start" \
            --predicate 'processImagePath == "/kernel"' 2>/dev/null \
            | grep -o 'deny(1) mach-lookup .*' | sort | uniq -c | sort -rn
          echo "=== P7 end ==="

          echo "=== P8 every denial of P5 and P6, by operation ==="
          /usr/bin/log show --style syslog --start "$start" \
            --predicate 'processImagePath == "/kernel"' 2>/dev/null \
            | grep -o ') deny(1) [a-z0-9-]*' | sort | uniq -c | sort -rn
          echo "=== P8 end ==="
          exit 0

      # The whole workspace, in debug. The macOS suites (e2e_macos,
      # e2e_macos_network, parity_watch) are part of the workspace, so this
      # one command runs them too. --nocapture keeps the profile and the log
      # lines that a failed assertion prints.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast -- --nocapture

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-linux-agents:
    name: E2E (Linux / Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor.
      # Pent needs them, also in the container.
      - name: Allow unprivileged user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this kernel has no apparmor_restrict_unprivileged_userns knob"
          fi

      - name: Build Docker image
        run: docker build --file e2e/Dockerfile --tag pent-test .

      # The default command of the image runs the e2e, integration and
      # profile tests in parallel. Pent needs no privilege; the default
      # seccomp and AppArmor profiles of Docker block unshare(2). The
      # overlay upper layers of pent are in /tmp, which must not be on
      # overlayfs: thus /tmp is a tmpfs.
      # Run 1: the masks of the container runtime stay. The kernel then
      # refuses a private /proc, and pent gives up the PID namespace with a
      # warning. This run proves that pent works in an ordinary container.
      - name: Run e2e tests (the masks of the runtime stay)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --tmpfs /tmp:exec,mode=1777 \
            --env PENT_REQUIRE_ALL_TESTS=1 \
            pent-test

      # Run 2: the same image with no mask below /proc. The kernel then
      # permits a private /proc, so pent keeps the PID namespace and the
      # containment of LS-3 holds inside a container too. Without this run
      # the pipeline would only prove that pent gives up gracefully, never
      # that the protection works where the kernel allows it.
      - name: Run e2e tests (no mask below /proc)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --tmpfs /tmp:exec,mode=1777 \
            --env PENT_REQUIRE_ALL_TESTS=1 \
            pent-test
