name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A test that skips proves nothing. With this variable, each skip is a
  # failure, so a job cannot stay green while the sandbox never ran. See
  # crates/pent/tests/common/e2e.rs.
  PENT_REQUIRE_ALL_TESTS: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The version of the runner decides which sandbox features work. Print
      # it, so that a future failure is easy to place.
      - name: Show the platform (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /etc/os-release | head -2
          echo "user.max_user_namespaces=$(sysctl -n user.max_user_namespaces 2>/dev/null || echo unknown)"

      - name: Show the platform (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          echo "developer directory: $(xcode-select --print-path 2>/dev/null || echo none)"
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables 2>/dev/null \
            || echo "the command line tools package is not registered"
          clang --version | head -1 || true
          ls -l /usr/bin/sandbox-exec /usr/bin/log /usr/bin/logger || true

      # TEMPORARY. The measurement of MAC-10 and MAC-12 on a runner.
      # It must come before every other step that touches the unified
      # log, because MAC-12 shows only on the first `log stream` of a
      # machine. Remove this step with the fix.
      - name: Measure MAC-10 and MAC-12 (temporary)
        if: runner.os == 'macOS'
        run: |
          cat > "$RUNNER_TEMP/measure.c" <<'PENT_MEASURE_EOF'
          /* The second measurement of MAC-10 and MAC-12 on a macOS runner.
           *
           * Round one gave:
           *   - the first `log stream` of a machine loses the reports of a probe
           *     that runs 17 ms after the header, and the next stream loses none;
           *   - sysctl KERN_PROC_ALL costs 0.107 ms, a fork of ps costs 35 ms;
           *   - proc_listchildpids costs 0.0056 ms;
           *   - a sleep of 5 ms gives a real interval of about 32 ms, so the poll
           *     interval does not follow the number that the code asks for.
           *
           * This round answers: how long the cold stream stays cold, which sleep
           * gives a real interval of a few milliseconds, how long the forked child
           * lives, and whether the cheap calls see a zombie.
           */
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>

          #include <mach/mach_time.h>
          #include <sys/proc.h>
          #include <sys/proc_info.h>
          #include <sys/qos.h>
          #include <sys/resource.h>
          #include <sys/select.h>
          #include <sys/stat.h>
          #include <sys/sysctl.h>
          #include <sys/types.h>
          #include <sys/wait.h>

          extern int proc_listchildpids(pid_t ppid, void *buffer, int buffersize);
          extern int proc_listallpids(void *buffer, int buffersize);
          extern int proc_pidinfo(int pid, int flavor, uint64_t arg, void *buffer,
                                  int buffersize);
          extern int proc_pidpath(int pid, void *buffer, uint32_t buffersize);

          #define PREDICATE                                                              \
            "processImagePath == \"/kernel\" AND (sender == \"Sandbox\" OR "             \
            "eventMessage BEGINSWITH \"Sandbox: \")"

          /* The profile of the warm-up probe: no path, so no escaping. The deny of
           * process-exec stops the program before it runs, and the kernel writes
           * one report with the process ID of the probe. */
          #define PROBE_PROFILE "(version 1)(allow default)(deny process-exec)"

          static double now_ms(void) {
            struct timespec ts;
            clock_gettime(CLOCK_MONOTONIC, &ts);
            return (double)ts.tv_sec * 1000.0 + (double)ts.tv_nsec / 1e6;
          }

          static double cpu_ms(const struct rusage *a, const struct rusage *b) {
            double u = (double)(a->ru_utime.tv_sec - b->ru_utime.tv_sec) * 1000.0 +
                       (double)(a->ru_utime.tv_usec - b->ru_utime.tv_usec) / 1000.0;
            double s = (double)(a->ru_stime.tv_sec - b->ru_stime.tv_sec) * 1000.0 +
                       (double)(a->ru_stime.tv_usec - b->ru_stime.tv_usec) / 1000.0;
            return u + s;
          }

          /* ── the reader of the log ─────────────────────────────────────────────── */

          typedef struct {
            int fd;
            pid_t pid;
            char buf[262144];
            size_t used;
          } LineReader;

          static int spawn_log(LineReader *r) {
            int p[2];
            if (pipe(p) < 0)
              return -1;
            pid_t pid = fork();
            if (pid < 0) {
              close(p[0]);
              close(p[1]);
              return -1;
            }
            if (pid == 0) {
              close(p[0]);
              dup2(p[1], 1);
              int devnull = open("/dev/null", O_RDWR);
              dup2(devnull, 0);
              dup2(devnull, 2);
              close(p[1]);
              execl("/usr/bin/log", "log", "stream", "--predicate", PREDICATE, "--style",
                    "syslog", (char *)NULL);
              _exit(127);
            }
            close(p[1]);
            r->fd = p[0];
            r->pid = pid;
            r->used = 0;
            return 0;
          }

          static void stop_log(LineReader *r) {
            kill(r->pid, SIGKILL);
            waitpid(r->pid, NULL, 0);
            close(r->fd);
          }

          static int next_line(LineReader *r, char *out, size_t outn, double deadline) {
            for (;;) {
              char *nl = (char *)memchr(r->buf, '\n', r->used);
              if (nl) {
                size_t n = (size_t)(nl - r->buf);
                size_t copy = n < outn - 1 ? n : outn - 1;
                memcpy(out, r->buf, copy);
                out[copy] = 0;
                memmove(r->buf, nl + 1, r->used - n - 1);
                r->used -= n + 1;
                return 1;
              }
              double left = deadline - now_ms();
              if (left <= 0)
                return 0;
              struct timeval tv;
              tv.tv_sec = (time_t)(left / 1000.0);
              tv.tv_usec = (suseconds_t)((left - (double)tv.tv_sec * 1000.0) * 1000.0);
              fd_set set;
              FD_ZERO(&set);
              FD_SET(r->fd, &set);
              if (select(r->fd + 1, &set, NULL, NULL, &tv) <= 0)
                return 0;
              if (r->used >= sizeof r->buf - 1)
                r->used = 0;
              ssize_t got = read(r->fd, r->buf + r->used, sizeof r->buf - r->used);
              if (got <= 0)
                return 0;
              r->used += (size_t)got;
            }
          }

          /* Run one probe and return its process ID. */
          static pid_t run_probe(void) {
            pid_t pid = fork();
            if (pid == 0) {
              int devnull = open("/dev/null", O_RDWR);
              dup2(devnull, 0);
              dup2(devnull, 1);
              dup2(devnull, 2);
              execl("/usr/bin/sandbox-exec", "sandbox-exec", "-p", PROBE_PROFILE,
                    "/usr/bin/true", (char *)NULL);
              _exit(127);
            }
            if (pid > 0)
              waitpid(pid, NULL, 0);
            return pid;
          }

          /* MAC-12. Start a log stream, then fire a probe every `gap_ms` until a
           * report of one of the probes arrives. */
          static void warm_up_round(int round, int gap_ms, double limit_ms) {
            LineReader r;
            double t0 = now_ms();
            if (spawn_log(&r) < 0) {
              printf("MAC12 round %d: log stream did not start\n", round);
              return;
            }
            char line[8192];
            double t_header = -1;
            if (next_line(&r, line, sizeof line, t0 + 15000))
              t_header = now_ms() - t0;

            double t_start = now_ms();
            pid_t probes[4096];
            int n_probes = 0;
            double found_at = -1;
            int found_probe = -1;
            int lines = 0;
            double next_probe = t_start;
            while (found_at < 0 && now_ms() - t_start < limit_ms) {
              if (now_ms() >= next_probe && n_probes < 4096) {
                probes[n_probes++] = run_probe();
                next_probe = now_ms() + gap_ms;
              }
              double wait_to = now_ms() + 50;
              if (wait_to > t_start + limit_ms)
                wait_to = t_start + limit_ms;
              while (next_line(&r, line, sizeof line, wait_to)) {
                lines++;
                for (int i = 0; i < n_probes; i++) {
                  char needle[32];
                  snprintf(needle, sizeof needle, "(%d) deny", (int)probes[i]);
                  if (strstr(line, needle)) {
                    found_at = now_ms() - t_start;
                    found_probe = i;
                    break;
                  }
                }
                if (found_at >= 0)
                  break;
              }
            }
            printf("MAC12 round %d: header %.0f ms, %d probes, the report of probe %d "
                   "arrived after %.0f ms, %d lines\n",
                   round, t_header, n_probes, found_probe, found_at, lines);
            fflush(stdout);
            stop_log(&r);
          }

          /* ── the sleep ─────────────────────────────────────────────────────────── */

          static mach_timebase_info_data_t tb;

          static void sleep_ns_nanosleep(long ns) {
            struct timespec ts = {ns / 1000000000L, ns % 1000000000L};
            nanosleep(&ts, NULL);
          }

          static void sleep_ns_mach(long ns) {
            uint64_t ticks = (uint64_t)ns * (uint64_t)tb.denom / (uint64_t)tb.numer;
            mach_wait_until(mach_absolute_time() + ticks);
          }

          static void sleep_ns_select(long ns) {
            struct timeval tv = {0, (suseconds_t)(ns / 1000)};
            select(0, NULL, NULL, NULL, &tv);
          }

          static void granularity(const char *label, int ms, int n, int how) {
            double t = now_ms();
            for (int i = 0; i < n; i++) {
              if (how == 0)
                sleep_ns_nanosleep((long)ms * 1000000L);
              else if (how == 1)
                sleep_ns_mach((long)ms * 1000000L);
              else
                sleep_ns_select((long)ms * 1000000L);
            }
            printf("a sleep of %2d ms with %-12s gives %6.2f ms\n", ms, label,
                   (now_ms() - t) / n);
            fflush(stdout);
          }

          /* ── the cost of the cheap calls ───────────────────────────────────────── */

          static void listallpids_cost(int rounds) {
            int pids[8192];
            struct proc_bsdinfo info;
            int n = proc_listallpids(pids, (int)sizeof pids) / (int)sizeof(int);
            struct rusage before, after;
            getrusage(RUSAGE_SELF, &before);
            double t = now_ms();
            for (int i = 0; i < rounds; i++) {
              int got = proc_listallpids(pids, (int)sizeof pids) / (int)sizeof(int);
              for (int k = 0; k < got; k++)
                proc_pidinfo(pids[k], PROC_PIDTBSDINFO, 0, &info, (int)sizeof info);
            }
            double wall = (now_ms() - t) / rounds;
            getrusage(RUSAGE_SELF, &after);
            printf("proc_listallpids with one proc_pidinfo each: %d processes, "
                   "%.3f ms wall, %.3f ms cpu per snapshot\n",
                   n, wall, cpu_ms(&after, &before) / rounds);
            fflush(stdout);
          }

          static void pidpath_cost(int rounds) {
            char path[4096];
            double t = now_ms();
            int last = 0;
            for (int i = 0; i < rounds; i++)
              last = proc_pidpath((int)getpid(), path, (uint32_t)sizeof path);
            printf("proc_pidpath: answer %d (%s), %.4f ms per call\n", last,
                   last > 0 ? path : "none", (now_ms() - t) / rounds);
            fflush(stdout);
          }

          /* Does a cheap call still see a child that exited and that nobody
           * reaped? The recorder needs the process ID of such a child. */
          static void zombie_visibility(void) {
            pid_t pid = fork();
            if (pid == 0)
              _exit(0);
            usleep(200000);
            pid_t kids[64];
            int n = proc_listchildpids(getpid(), kids, (int)sizeof kids);
            int in_children = 0;
            for (int i = 0; i < n / (int)sizeof(pid_t); i++)
              if (kids[i] == pid)
                in_children = 1;
            struct proc_bsdinfo info;
            int got = proc_pidinfo(pid, PROC_PIDTBSDINFO, 0, &info, (int)sizeof info);
            printf("a zombie child: proc_listchildpids holds it: %s; "
                   "proc_pidinfo answers %d, status %u (SZOMB is %d), name %s, ppid %u\n",
                   in_children ? "yes" : "no", got, got > 0 ? info.pbi_status : 0, SZOMB,
                   got > 0 ? info.pbi_comm : "none", got > 0 ? info.pbi_ppid : 0);
            char path[4096];
            int pp = proc_pidpath(pid, path, (uint32_t)sizeof path);
            printf("a zombie child: proc_pidpath answers %d (%s)\n", pp,
                   pp > 0 ? path : "none");
            fflush(stdout);
            waitpid(pid, NULL, 0);
          }

          /* ── the window of the fork ────────────────────────────────────────────── */

          static void write_file(const char *path, const char *text) {
            FILE *f = fopen(path, "w");
            if (f) {
              fputs(text, f);
              fclose(f);
            }
          }

          /* The true life of the child of `sh -c 'cat FILE; echo END'`, with a spin
           * on proc_listchildpids, which costs 6 microseconds. */
          static void child_life(int rounds) {
            char file[256];
            snprintf(file, sizeof file, "/private/tmp/pentlife-%d.txt", (int)getpid());
            write_file(file, "x\n");
            char shell[512];
            snprintf(shell, sizeof shell, "cat %s >/dev/null; echo END >/dev/null", file);
            double total = 0, worst = 1e9, best = 0;
            int seen = 0;
            for (int i = 0; i < rounds; i++) {
              pid_t pid = fork();
              if (pid == 0) {
                int devnull = open("/dev/null", O_WRONLY);
                dup2(devnull, 1);
                dup2(devnull, 2);
                execl("/bin/sh", "sh", "-c", shell, (char *)NULL);
                _exit(127);
              }
              double first = -1, last = -1;
              pid_t kids[64];
              for (;;) {
                int n = proc_listchildpids(pid, kids, (int)sizeof kids);
                if (n > 0) {
                  if (first < 0)
                    first = now_ms();
                  last = now_ms();
                }
                if (waitpid(pid, NULL, WNOHANG) == pid)
                  break;
              }
              if (first > 0) {
                double life = last - first;
                total += life;
                seen++;
                if (life < worst)
                  worst = life;
                if (life > best)
                  best = life;
              }
            }
            printf("the forked child of sh: seen in %d of %d runs with a spin; "
                   "the spin held it for %.2f ms on average, %.2f ms at least, "
                   "%.2f ms at most\n",
                   seen, rounds, seen ? total / seen : 0.0, seen ? worst : 0.0, best);
            fflush(stdout);
          }

          /* How often a poll of `interval_ms` with `mach_wait_until` sees the
           * forked child. */
          static void catch_rate(int interval_ms, int rounds) {
            char file[256];
            snprintf(file, sizeof file, "/private/tmp/pentcatch2-%d.txt", (int)getpid());
            write_file(file, "x\n");
            char shell[512];
            snprintf(shell, sizeof shell, "cat %s >/dev/null; echo END >/dev/null", file);
            int seen = 0;
            struct rusage before, after;
            getrusage(RUSAGE_SELF, &before);
            double t_all = now_ms();
            for (int i = 0; i < rounds; i++) {
              pid_t pid = fork();
              if (pid == 0) {
                int devnull = open("/dev/null", O_WRONLY);
                dup2(devnull, 1);
                dup2(devnull, 2);
                execl("/bin/sh", "sh", "-c", shell, (char *)NULL);
                _exit(127);
              }
              sleep_ns_mach((long)(rand() % (interval_ms * 1000)) * 1000L);
              int found = 0;
              pid_t kids[64];
              for (;;) {
                if (proc_listchildpids(pid, kids, (int)sizeof kids) > 0)
                  found = 1;
                if (waitpid(pid, NULL, WNOHANG) == pid)
                  break;
                sleep_ns_mach((long)interval_ms * 1000000L);
              }
              if (found)
                seen++;
            }
            getrusage(RUSAGE_SELF, &after);
            printf("a poll of %3d ms with mach_wait_until: the child was there in "
                   "%2d of %d runs; %.0f ms wall, %.0f ms cpu\n",
                   interval_ms, seen, rounds, now_ms() - t_all,
                   cpu_ms(&after, &before));
            fflush(stdout);
          }

          int main(void) {
            srand(7);
            mach_timebase_info(&tb);
            printf("=== MAC-12: the first log stream of this machine ===\n");
            fflush(stdout);
            warm_up_round(0, 250, 60000);
            warm_up_round(1, 250, 20000);

            printf("=== the sleep ===\n");
            fflush(stdout);
            for (int how = 0; how < 3; how++) {
              const char *label =
                  how == 0 ? "nanosleep" : (how == 1 ? "mach_wait_until" : "select");
              granularity(label, 1, 100, how);
              granularity(label, 5, 60, how);
              granularity(label, 10, 40, how);
            }
            pthread_set_qos_class_self_np(QOS_CLASS_USER_INTERACTIVE, 0);
            printf("--- the same after the thread asks for the interactive class ---\n");
            for (int how = 0; how < 3; how++) {
              const char *label =
                  how == 0 ? "nanosleep" : (how == 1 ? "mach_wait_until" : "select");
              granularity(label, 1, 100, how);
              granularity(label, 5, 60, how);
            }

            printf("=== MAC-10: the cheap calls ===\n");
            fflush(stdout);
            listallpids_cost(50);
            pidpath_cost(2000);
            zombie_visibility();

            printf("=== MAC-10: the window of the fork ===\n");
            fflush(stdout);
            child_life(30);
            catch_rate(100, 40);
            catch_rate(10, 40);
            catch_rate(5, 40);
            catch_rate(2, 40);
            catch_rate(1, 40);
            return 0;
          }
          PENT_MEASURE_EOF
          clang -O2 -o "$RUNNER_TEMP/measure" "$RUNNER_TEMP/measure.c"
          "$RUNNER_TEMP/measure"

      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor. Pent
      # needs them. Without this step every sandbox test skips, and the job
      # proves nothing.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this kernel has no apparmor_restrict_unprivileged_userns knob"
          fi

      - name: Build
        run: cargo build --workspace --tests

      # The whole workspace, in debug. The macOS suites (e2e_macos,
      # e2e_macos_network, parity_watch) are part of the workspace, so this
      # one command runs them too. --nocapture keeps the profile and the log
      # lines that a failed assertion prints.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast -- --nocapture

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-linux-agents:
    name: E2E (Linux / Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor.
      # Pent needs them, also in the container.
      - name: Allow unprivileged user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this kernel has no apparmor_restrict_unprivileged_userns knob"
          fi

      - name: Build Docker image
        run: docker build --file e2e/Dockerfile --tag pent-test .

      # The default command of the image runs the e2e, integration and
      # profile tests in parallel. Pent needs no privilege; the default
      # seccomp and AppArmor profiles of Docker block unshare(2). The
      # overlay upper layers of pent are in /tmp, which must not be on
      # overlayfs: thus /tmp is a tmpfs.
      # Run 1: the masks of the container runtime stay. The kernel then
      # refuses a private /proc, and pent gives up the PID namespace with a
      # warning. This run proves that pent works in an ordinary container.
      - name: Run e2e tests (the masks of the runtime stay)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --tmpfs /tmp:exec,mode=1777 \
            --env PENT_REQUIRE_ALL_TESTS=1 \
            pent-test

      # Run 2: the same image with no mask below /proc. The kernel then
      # permits a private /proc, so pent keeps the PID namespace and the
      # containment of LS-3 holds inside a container too. Without this run
      # the pipeline would only prove that pent gives up gracefully, never
      # that the protection works where the kernel allows it.
      - name: Run e2e tests (no mask below /proc)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --tmpfs /tmp:exec,mode=1777 \
            --env PENT_REQUIRE_ALL_TESTS=1 \
            pent-test
